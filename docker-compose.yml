services:
  cv-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-vacancy-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/evaluations.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
